[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:frontend]
directory=/atlasnet/AtlasNetCartographFrontend
command=npm run preview -- --host
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2

[program:backend]
directory=/atlasnet/AtlasNetCartographBackend
command=/atlasnet/AtlasNetCartographBackend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2