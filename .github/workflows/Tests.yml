name: CI

on:
  pull_request:
  push:
    branches: [main, NetworkRework, Development]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      # Keep CI lean: tests only (no Cartograph/examples/dev)
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build clang lld pkg-config \
            autoconf automake libtool \
            libssl-dev zlib1g-dev \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxext-dev

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ env.VCPKG_ROOT }}

      - name: Cache vcpkg installed packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
            ${{ github.workspace }}/build/vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-triplets/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Configure
        run: |
          mkdir -p "${VCPKG_DEFAULT_BINARY_CACHE}"
          cmake --preset linux-vcpkg-debug \
            -DVCPKG_MANIFEST_FEATURES=testing \
            -DATLASNET_CARTOGRAPH=OFF \
            -DATLASNET_EXAMPLES=OFF \
            -DATLASNET_DEV=OFF \
            -DATLASNET_TESTS=ON

      - name: Build
        run: cmake --build build --config Debug -j"$(nproc)"

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
