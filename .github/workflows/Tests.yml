name: CI

on:
  pull_request:
  push:
    branches: [main, NetworkRework, Development]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
      # Match local / builtin-baseline in vcpkg.json
      VCPKG_COMMIT: b773faa425fbb6804af8dcdaa6bd725409fc4c80

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build clang-18 lld-18 libc++-18-dev libc++abi-18-dev pkg-config \
            autoconf autoconf-archive automake libtool \
            libssl-dev zlib1g-dev \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxext-dev
          command -v clang++-18
          command -v ninja
          test -f /usr/include/c++/v1/expected
          dpkg -l autoconf-archive | tail -1

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ env.VCPKG_ROOT }}
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}

      - name: Cache vcpkg installed packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
            ${{ github.workspace }}/build/vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'vcpkg-triplets/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-
            vcpkg-${{ runner.os }}-

      - name: Configure
        run: |
          mkdir -p "${VCPKG_DEFAULT_BINARY_CACHE}"
          cmake --preset linux-vcpkg-debug \
            -DVCPKG_MANIFEST_FEATURES=testing \
            -DATLASNET_CARTOGRAPH=OFF \
            -DATLASNET_EXAMPLES=OFF \
            -DATLASNET_DEV=OFF \
            -DATLASNET_TESTS=ON

      - name: Build
        run: cmake --build build --config Debug -j"$(nproc)"

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
